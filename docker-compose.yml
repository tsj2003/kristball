services:
  postgres:
    image: postgres:16-alpine
    container_name: kristallball-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kristallball
      POSTGRES_PASSWORD: kristallball_dev
      POSTGRES_DB: kristallball
    ports:
      - "5432:5432"
    volumes:
      - kristallball_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kristallball -d kristallball"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kristallball_pgdata:
